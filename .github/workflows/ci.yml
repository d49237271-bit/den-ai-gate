name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main, stable]
  push:
    branches: [main, stable]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen --extra dev
      - name: Install Claude Code for worker boundary tests
        run: npm install -g @anthropic-ai/claude-code
      - name: Gateway tests
        run: uv run pytest -q
      - name: Bot tests
        working-directory: bot
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          .venv/bin/python -m pytest -q
      - name: Smoke-load config.yaml.example
        run: |
          uv run python -c "import yaml; yaml.safe_load(open('config.yaml.example'))"
      - name: Smoke-load real config.yaml via load_config
        run: |
          uv run python -c "import sys; sys.path.insert(0, 'src'); from neurogate.config import load_config; load_config('config.yaml.example')"
      - name: Smoke-load paid_models_blocklist.yaml
        run: |
          uv run python -c "import yaml; assert isinstance(yaml.safe_load(open('scans/paid_models_blocklist.yaml')), dict)"
